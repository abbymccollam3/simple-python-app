apiVersion: apps/v1 # which API group and version to use
kind: Deployment # type of workload resource that run and manage containers and pods
metadata:
  name: simple-python-app-v1 # name of Deployment
  labels:
    tags.datadoghq.com/env: lab
    tags.datadoghq.com/service: simple-python-app
    tags.datadoghq.com/version: "0.1"
spec:
  replicas: 1 # amount of pods to create
  selector:
    matchLabels: # Deployment manages any pods with this label
      app.kubernetes.io/name: simple-python-app
  template:
    metadata: # labels and names for pods that will be created
      name: simple-python-app # name of pod
      labels:
        app.kubernetes.io/name: simple-python-app
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/env: lab
        tags.datadoghq.com/service: simple-python-app
        tags.datadoghq.com/version: "0.1"
    spec: # what containers to run, resource limits, env variables
      containers:
        - name: simple-python-app 
          image: IMAGE_REPO/simple-python-app
          imagePullPolicy: Always
          resources: 
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-python-app-v2
  labels:
    tags.datadoghq.com/env: lab
    tags.datadoghq.com/service: simple-python-app
    tags.datadoghq.com/version: "0.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simple-python-app
  template:
    metadata:
      name: simple-python-app
      labels:
        app.kubernetes.io/name: simple-python-app
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/env: lab
        tags.datadoghq.com/service: simple-python-app
        tags.datadoghq.com/version: "0.2"
    spec:
      containers:
        - name: simple-python-app 
          image: IMAGE_REPO/simple-python-app
          imagePullPolicy: Always
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
---
kind: Service # providing stable network endpoint to access the pods
apiVersion: v1
metadata:
  labels:
    app: simple-python-app
  name: simple-python-app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: simple-python-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
